<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — WAWA PHOTOBOOTH</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/media/icons/favicon-32.png" type="image/png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/boot.js"></script>
</head>
<body class="admin">
<a class="skip-link" href="#main">Aller au contenu</a>

<!-- Connexion -->
<section class="login" data-view="login" hidden>
  <form class="login__card" id="login-form" autocomplete="on" novalidate>
    <img src="/media/img/logo-embleme-clair.webp" width="760" height="635" alt="WAWA PHOTOBOOTH" class="login__logo">
    <h1>Espace administration</h1>
    <p class="muted">Accès réservé aux personnes habilitées.</p>
    <p class="notice-box notice-box--warn" data-config-warning hidden></p>
    <p class="notice-box" data-session-msg hidden></p>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Mot de passe<span class="pw"><input type="password" name="password" autocomplete="current-password" required><button type="button" class="pw__toggle" data-pw-toggle aria-label="Afficher le mot de passe" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="pw__slash" d="M3 3l18 18"/></svg></button></span></label>
    <p class="error-text" role="alert" data-login-error hidden></p>
    <button class="abtn abtn--gold abtn--lg" type="submit">Se connecter</button>
    <p class="login__foot muted">Connexion protégée : session limitée à 2 h, verrouillage après échecs, journal des accès.</p>
  </form>
</section>

<!-- Application -->
<div class="shell" data-view="app" hidden>
  <aside class="side" id="side" aria-label="Menu d’administration">
    <div class="side__brand"><img src="/media/img/logo-embleme-clair.webp" width="760" height="635" alt="WAWA PHOTOBOOTH"><span>Administration</span></div>
    <nav class="side__nav" data-nav></nav>
    <div class="side__foot">
      <span class="side__me" data-who></span>
      <button class="abtn abtn--ghost abtn--sm" type="button" data-logout><svg class="icon" aria-hidden="true" focusable="false"><use href="/media/icons/sprite.svg#i-logout"/></svg>Se déconnecter</button>
    </div>
  </aside>
  <div class="main-col">
    <header class="top">
      <button class="top__menu" type="button" data-menu aria-controls="side" aria-expanded="false" aria-label="Ouvrir le menu"><svg class="icon" aria-hidden="true" focusable="false"><use href="/media/icons/sprite.svg#i-menu"/></svg></button>
      <h1 class="top__title" data-title>Tableau de bord</h1>
      <form class="top__search" role="search" data-search-form>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="/media/icons/sprite.svg#i-search"/></svg>
        <input type="search" name="q" placeholder="Rechercher une demande (nom, email, référence…)" aria-label="Rechercher une demande" autocomplete="off">
      </form>
      <button class="abtn abtn--ghost abtn--sm top__refresh" type="button" data-refresh title="Actualiser"><span data-updated>Actualiser</span></button>
    </header>
    <div class="toasts" data-toasts role="status" aria-live="polite"></div>
    <main id="main" class="content" tabindex="-1" data-content></main>
  </div>
</div>

<!-- Fiche d’une demande (panneau latéral) -->
<dialog class="sheet" data-sheet aria-labelledby="sheet-title"></dialog>
<!-- Boîte de confirmation -->
<dialog class="confirm" data-confirm></dialog>

<script type="module" src="/js/admin/main.js"></script>
</body>
</html>
